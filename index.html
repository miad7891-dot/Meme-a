<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محاكي جوال تفاعلي</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #fff;
    }
    .phone {
      width: 340px;
      height: 680px;
      background: #111827;
      border: 10px solid #334155;
      border-radius: 42px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }
    .status-bar {
      padding: 10px 18px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      background: #0b1120;
    }
    .screen {
      flex: 1;
      padding: 18px;
      background: linear-gradient(160deg, #1e293b, #0f172a);
      overflow-y: auto;
    }
    .home-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 20px;
    }
    .app-btn {
      background: #2563eb;
      border: none;
      border-radius: 16px;
      padding: 14px 8px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .app-btn.alt { background: #0d9488; }
    .dock {
      padding: 10px;
      background: #0b1120;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .home-bar {
      width: 110px;
      height: 5px;
      border-radius: 999px;
      background: #94a3b8;
      border: none;
      cursor: pointer;
    }
    input, textarea, button.action {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
    }
    button.action { background: #3b82f6; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span id="clock">12:00</span>
      <span>5G • 100%</span>
    </div>

    <div class="screen" id="screen"></div>

    <div class="dock">
      <button class="home-bar" title="الرئيسية" onclick="renderHome()"></button>
    </div>
  </div>

  <script>
    const screen = document.getElementById("screen");
    let count = 0;

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleTimeString("ar-SA", { hour: "2-digit", minute: "2-digit" });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function renderHome() {
      screen.innerHTML = `
        <h3>الشاشة الرئيسية</h3>
        <p style="font-size:13px;color:#cbd5e1">اختر تطبيقاً لتجربته داخل المحاكي:</p>
        <div class="home-grid">
          <button class="app-btn" onclick="renderCounter()">🔢 العداد</button>
          <button class="app-btn alt" onclick="renderNotes()">📝 ملاحظة</button>
        </div>
      `;
    }

    function renderCounter() {
      screen.innerHTML = `
        <h3>تطبيق العداد</h3>
        <p style="font-size:32px;text-align:center" id="val">${count}</p>
        <button class="action" onclick="changeCount(1)">زيادة (+1)</button>
        <button class="action" style="background:#475569" onclick="changeCount(-1)">إنقاص (-1)</button>
      `;
    }

    function changeCount(delta) {
      count += delta;
      document.getElementById("val").textContent = count;
    }

    function renderNotes() {
      const saved = localStorage.getItem("sim_note") || "";
      screen.innerHTML = `
        <h3>الملاحظات</h3>
        <textarea rows="6" id="noteBox" placeholder="اكتب شيئاً...">${saved}</textarea>
        <button class="action" onclick="saveNote()">حفظ في المتصفح</button>
        <p id="statusMsg" style="font-size:12px;color:#34d399"></p>
      `;
    }

    function saveNote() {
      localStorage.setItem("sim_note", document.getElementById("noteBox").value);
      document.getElementById("statusMsg").textContent = "تم الحفظ محلياً (localStorage).";
    }

    renderHome();
  </script>
</body>
</html>
